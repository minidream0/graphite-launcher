name: Frontend

on:
  push:
    paths: ['graphite-web/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['graphite-web/**', '.github/workflows/frontend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphite-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: graphite-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
